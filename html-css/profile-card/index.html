<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal profile card.">
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <article class="profile-card">
            <div class="profile-image">
                <img src="images/brandon_dp.jpg" alt="Sir Fire Portrait">
            </div>

            <div class="profile-details">
                <h1>Sir Fire</h1>
                <p class="role">Developer & Technology Enthusiast</p>
                <p class="bio">
                    Building useful things, exploring technology
                    and learning something new every day.
                </p>
                <p class="availability">
                    <span class="status-dot"></span>
                    Open to Opportunities
                </p>
            </div>

            <div class="profile-actions">
                <a
                    href="https://github.com/sirfireprojects"
                    target="_blank"
                    rel="noopener noreferrer"
                    id="github-link"
                >
                    View GitHub Profile
                </a>
            </div>
        </article>
    </main>

</body>
</html>
